# Included in every location: nginx's add_header is not inherited by a location that
# defines its own add_header, so the headers live in one snippet instead.

# Only same-origin resources. The app has no inline scripts or styles, so no 'unsafe-inline'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# HSTS belongs on the TLS-terminating edge (e.g. the AWS load balancer), not on plain HTTP.
