# CI/CD for the three-tier task platform.
#
#   ┌──────────────── quality gates (parallel) ────────────────┐
#   │ format · backend (lint, types, unit + integration tests)  │
#   │ frontend (lint, types, tests, build)                      │
#   │ secrets (Gitleaks) · sca (Trivy deps) · fs-scan (Trivy)   │
#   └───────────────────────────┬───────────────────────────────┘
#                               ▼
#        build-scan (backend, frontend): build image → Trivy image scan → SBOM
#                               ▼   only on push to main, only if every job above passed
#        publish (backend, frontend): GitHub OIDC → AWS role → push to ECR as :<git-sha>
#
# Any failed gate stops the run before an image is published. The image pushed to ECR is
# byte-for-byte the archive that was scanned, not a rebuild.
#
# Third-party actions are pinned to full commit SHAs and scanner images to digests, so a
# moved tag upstream cannot change what runs here. Dependabot proposes updates.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; the publish job alone adds id-token: write.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede outdated PR runs, but never cancel a run that may be publishing from main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
  # Gate threshold for every Trivy scan. Findings with no released fix are reported but do
  # not block, since there is nothing to upgrade to; they are re-checked on every run.
  TRIVY_SEVERITY: HIGH,CRITICAL

jobs:
  # ─────────────────────────────── code quality ───────────────────────────────
  format:
    name: Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install (lockfile)
        run: npm ci --ignore-scripts
      - name: Check formatting
        run: npm run format:check

  backend:
    name: Backend lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      # Disposable database for integration tests. Trust auth: no credential exists at all.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_DB: taskdb_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ci -d taskdb_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install (lockfile)
        run: npm ci --ignore-scripts
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Integration tests (PostgreSQL)
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://ci@localhost:5432/taskdb_test
      - name: Build
        run: npm run build

  frontend:
    name: Frontend lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (lockfile)
        run: npm ci --ignore-scripts
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  # ─────────────────────────────── security gates ───────────────────────────────
  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret committed and later deleted is still exposed.
          fetch-depth: 0
          persist-credentials: false
      - name: Scan git history
        # The container runs as a different user than the checkout owner, so git needs the
        # repository marked safe. --redact keeps any finding's value out of the logs.
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            "$GITLEAKS_IMAGE" \
            git /repo --config /repo/.gitleaks.toml --redact --verbose --exit-code 1

  sca:
    name: Dependency scan (Trivy SCA)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &trivy-cache-key
        name: Trivy DB cache key
        id: trivy-day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - &trivy-cache
        name: Cache Trivy DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-db-${{ steps.trivy-day.outputs.day }}
          restore-keys: trivy-db-
      - name: Scan npm lockfiles (including dev dependencies)
        # Dev dependencies run in CI and on developer machines, so they are in scope too.
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" -v "$RUNNER_TEMP/trivy-cache:/cache" \
            "$TRIVY_IMAGE" fs --cache-dir /cache \
            --scanners vuln --pkg-types library --include-dev-deps \
            --severity "$TRIVY_SEVERITY" --ignore-unfixed --exit-code 1 \
            --skip-dirs node_modules /src

  fs-scan:
    name: Repository scan (Trivy vuln, misconfig, secret)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *trivy-cache-key
      - *trivy-cache
      - name: Scan repository
        # Misconfiguration checks cover the Dockerfiles (and Terraform once added); the secret
        # scanner is a second, independent check alongside Gitleaks.
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" -v "$RUNNER_TEMP/trivy-cache:/cache" \
            "$TRIVY_IMAGE" fs --cache-dir /cache \
            --scanners vuln,misconfig,secret \
            --severity "$TRIVY_SEVERITY" --ignore-unfixed --exit-code 1 \
            --skip-dirs node_modules /src

  # ─────────────────────────────── images ───────────────────────────────
  build-scan:
    name: Build & scan image (${{ matrix.component }})
    needs: [format, backend, frontend, secrets, sca, fs-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - component: backend
            dockerfile: docker/backend.Dockerfile
          - component: frontend
            dockerfile: docker/frontend.Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: ${{ matrix.component }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # Export to a tarball: this exact archive is scanned here and pushed by `publish`.
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - *trivy-cache-key
      - *trivy-cache
      - name: Scan image (gate)
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP:/work" -v "$RUNNER_TEMP/trivy-cache:/cache" \
            "$TRIVY_IMAGE" image --cache-dir /cache --input /work/image.tar \
            --scanners vuln,secret \
            --severity "$TRIVY_SEVERITY" --ignore-unfixed --exit-code 1
      - name: Full report and SBOM
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          run_trivy() {
            docker run --rm -v "$RUNNER_TEMP:/work" -v "$RUNNER_TEMP/trivy-cache:/cache" \
              "$TRIVY_IMAGE" image --cache-dir /cache --input /work/image.tar "$@"
          }
          run_trivy --scanners vuln --format json --output /work/reports/vulnerabilities.json
          run_trivy --format cyclonedx --output /work/reports/sbom.cdx.json
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ matrix.component }}
          path: ${{ runner.temp }}/reports/
          retention-days: 30
      - name: Upload scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.component }}
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
      - name: Note when publishing is not configured
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN == ''
        run: |
          echo "::warning::AWS_ROLE_ARN is not set; images were built and scanned but not published. See docs/ci-cd.md."

  publish:
    name: Publish to ECR (${{ matrix.component }})
    needs: build-scan
    # Only trusted code on main reaches AWS. Pull requests never get credentials.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # lets this job request a short-lived OIDC token for AWS STS
    strategy:
      matrix:
        include:
          - component: backend
            repository: ${{ vars.ECR_REPOSITORY_BACKEND || 'task-platform/backend' }}
          - component: frontend
            repository: ${{ vars.ECR_REPOSITORY_FRONTEND || 'task-platform/frontend' }}
    steps:
      - name: Download scanned image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.component }}
          path: ${{ runner.temp }}
      - name: Authenticate to AWS (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-${{ github.run_id }}-${{ matrix.component }}
          role-duration-seconds: 900
      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Push image tagged with the commit SHA
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ matrix.repository }}
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/$REPOSITORY:$GITHUB_SHA"

          # Tags are immutable in ECR. A re-run for the same commit is a no-op, not a failure.
          if aws ecr describe-images --repository-name "$REPOSITORY" \
               --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "::notice::$IMAGE already exists; immutable tag left unchanged."
            exit 0
          fi

          docker load --input "$RUNNER_TEMP/image.tar"
          docker tag "$COMPONENT:$GITHUB_SHA" "$IMAGE"
          docker push "$IMAGE"

          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          {
            echo "### $COMPONENT published"
            echo "- Tag: \`$IMAGE\`"
            echo "- Digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
